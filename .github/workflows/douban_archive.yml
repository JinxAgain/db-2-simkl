name: Douban Watch History Archive

on:
  schedule:
    - cron: '21 * * * *' # Run hourly at minute 21 (off-peak to avoid global queue delays)
  workflow_dispatch: # Allow manual trigger
    inputs:
      frodo_limit:
        description: 'Frodo API backfill limit per status (done/doing/mark)'
        required: false
        default: 'default (from config.json)'
        type: choice
        options:
          - 'default (from config.json)'
          - '50'
          - '100'
          - '0 (disable Frodo)'

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run archive script
        run: |
          LIMIT="${{ github.event.inputs.frodo_limit }}"
          if [ "$LIMIT" = "50" ] || [ "$LIMIT" = "100" ]; then
            python archive_douban.py --frodo-limit "$LIMIT"
          elif [ "$LIMIT" = "0 (disable Frodo)" ]; then
            python archive_douban.py --no-frodo
          else
            python archive_douban.py
          fi

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add douban_archive.jsonl sync_history_archive.json || true
          # Only commit if there are changes
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update Douban watch archive" && git push)
